<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Album - NuiStagram</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav>
        <a href="/" class="logo">NuiStagram</a>
        <div class="nav-auth">
            <span>{{.User.Username}}</span>
            <a href="/albums">Albums</a>
            <a href="/logout">Logout</a>
        </div>
    </nav>
    <main>
        <h1>Create New Album</h1>
        <form method="POST" class="upload-form">
            <div class="form-group">
                <label for="name">Album Name</label>
                <input type="text" id="name" name="name" required placeholder="e.g., Summer Vacation 2024">
            </div>
            <div class="form-group">
                <label for="description">Description (optional)</label>
                <textarea id="description" name="description" rows="3" placeholder="What's this album about?"></textarea>
            </div>
            <button type="submit">Create Album</button>
            <a href="/albums" class="btn btn-secondary btn-cancel">Cancel</a>
        </form>
    </main>
</body>
</html>
