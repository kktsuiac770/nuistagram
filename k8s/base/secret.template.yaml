# ─────────────────────────────────────────────────────────────────────────────
# NUIstagram Secret Template
#
# Instructions:
#   1. Copy this file:  cp k8s/secret.template.yaml k8s/secret.yaml
#   2. Replace every placeholder value with the real value
#   3. Apply:           kubectl apply -f k8s/secret.yaml
#
# IMPORTANT: k8s/secret.yaml is git-ignored. Never commit real secrets.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: nuistagram-secret
  namespace: nuistagram
  labels:
    app.kubernetes.io/name: nuistagram
type: Opaque
stringData:
  DATABASE_URL: "postgres://user:password@host:5432/nuistagram?sslmode=disable"
  JWT_SECRET: "change-me-to-at-least-32-random-characters-here"
  CLOUDINARY_CLOUD_NAME: "<your-cloudinary-cloud-name>"
  CLOUDINARY_API_KEY: "<your-cloudinary-api-key>"
  CLOUDINARY_API_SECRET: "<your-cloudinary-api-secret>"
