<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Photo - NuiStagram</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav>
        <a href="/" class="logo">NuiStagram</a>
        <div class="nav-auth">
            <span>{{.User.Username}}</span>
            <a href="/logout">Logout</a>
        </div>
    </nav>
    <main>
        <h1>Edit Photo</h1>
        <div class="edit-form-container">
            <div class="edit-preview">
                <img src="/static/uploads/{{.Photo.Filename}}" alt="Photo">
            </div>
            <form method="POST" class="upload-form">
                <div class="form-group">
                    <label for="nui_names">Nui Names <small>(comma-separated for multiple)</small></label>
                    <input type="text" id="nui_names" name="nui_names" list="nui-list" required value="{{range $i, $name := .Photo.NuiNames}}{{if $i}}, {{end}}{{$name}}{{end}}">
                    <datalist id="nui-list">
                        {{range .Nuis}}
                        <option value="{{.Name}}">
                        {{end}}
                    </datalist>
                </div>
                <div class="form-group">
                    <label for="taken_at">Date Taken</label>
                    <input type="date" id="taken_at" name="taken_at" value="{{if not .Photo.TakenAt.IsZero}}{{.Photo.TakenAt.Format "2006-01-02"}}{{end}}">
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" rows="3">{{.Photo.Description}}</textarea>
                </div>
                <button type="submit">Save Changes</button>
                <a href="/photo/{{.Photo.ID}}" class="btn btn-secondary btn-cancel">Cancel</a>
            </form>
        </div>
    </main>
</body>
</html>
