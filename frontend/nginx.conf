server {
    listen 8080;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy all backend routes to the Go API service.
    # These match the Vite dev proxy config (vite.config.ts) plus /export.
    location ~ ^/(api|login|register|logout|upload|photo|static|export|healthz|readyz)(/|$) {
        proxy_pass         http://nuistagram-backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Match the app's 100 MiB multipart limit
        client_max_body_size 100m;
        proxy_read_timeout   120s;
        proxy_send_timeout   120s;
    }

    # React SPA — serve index.html for all non-asset routes (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
