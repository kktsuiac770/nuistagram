apiVersion: v1
kind: Service
metadata:
  name: nuistagram-frontend
  namespace: nuistagram
  labels:
    app.kubernetes.io/name: nuistagram-frontend
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nuistagram-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
