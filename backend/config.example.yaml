# NUIstagram Configuration
# Copy this file to config.yaml and customize as needed
# Environment variables (PORT, DATABASE_URL, SECURE_COOKIE) override these values

server:
  # Port the server listens on (default: 8080)
  # Override with: PORT=8080
  port: 8080

database:
  # PostgreSQL connection URL (required)
  # Override with: DATABASE_URL=postgres://user:password@localhost:5432/nuistagram?sslmode=disable
  url: ""

  # Connection pool settings
  max_open_conns: 10    # Maximum open connections
  max_idle_conns: 5     # Maximum idle connections
  conn_max_lifetime: 1h # Maximum time a connection can be reused
  conn_max_idle_time: 10m # Maximum time an idle connection is kept

security:
  # Set to true in production with HTTPS (default: false)
  # Override with: SECURE_COOKIE=true
  secure_cookie: false

paths:
  # React production build directory (default: frontend/dist)
  react_dist: frontend/dist
  # Static files directory (default: static)
  static: static

storage:
  # Storage backend: "local" (default) or "cloudinary"
  # Override with: STORAGE_PROVIDER=cloudinary
  provider: local

  # Local storage — directory where uploads are saved (local only)
  # Override with: STORAGE_UPLOAD_DIR=static/uploads
  upload_dir: static/uploads

  # Cloudinary credentials (required when provider = "cloudinary")
  # Override with env vars: CLOUDINARY_CLOUD_NAME / CLOUDINARY_API_KEY / CLOUDINARY_API_SECRET
  cloud_name: ""
  api_key: ""
  api_secret: ""

  # Cloudinary folder prefix for all uploaded assets (default: nuistagram)
  # Override with: CLOUDINARY_FOLDER=nuistagram
  folder: nuistagram

jwt:
  # Required — at least 32 bytes of random entropy
  # Override with: JWT_SECRET=<random-secret>
  secret: ""

  # Access token lifetime (default: 15m)
  # Override with: JWT_ACCESS_TTL=15m
  access_token_ttl: 15m

  # Refresh token lifetime (default: 168h = 7 days)
  # Override with: JWT_REFRESH_TTL=168h
  refresh_token_ttl: 168h

# Usage limits by role (admin accounts have no limits)
# To promote a user to admin: UPDATE users SET role='admin' WHERE username='alice';
# To change a role via API (admin only): POST /admin/users/{username}/role {"role":"pro"}
usage_limits:
  basic:
    uploads_per_day: 10
    avatars_per_day: 3
    exports_per_day: 1
    comments_per_hour: 20
    likes_per_hour: 50
  pro:
    uploads_per_day: 50
    avatars_per_day: 10
    exports_per_day: 5
    comments_per_hour: 100
    likes_per_hour: 200
  max:
    uploads_per_day: 200
    avatars_per_day: 50
    exports_per_day: 20
    comments_per_hour: 500
    likes_per_hour: 1000
