<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload - NuiStagram</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav>
        <a href="/" class="logo">NuiStagram</a>
        <div class="nav-auth">
            <span>{{.User.Username}}</span>
            <a href="/favorites">★</a>
            <a href="/albums">Albums</a>
            <a href="/logout">Logout</a>
        </div>
    </nav>
    <main>
        <h1>Upload Photos</h1>
        <form method="POST" enctype="multipart/form-data" class="upload-form">
            <div class="form-group">
                <label for="photos">Photos <small>(select multiple files)</small></label>
                <input type="file" id="photos" name="photos" accept="image/*" multiple required>
            </div>
            <div class="form-group">
                <label for="nui_names">Nui Names <small>(comma-separated for multiple)</small></label>
                <input type="text" id="nui_names" name="nui_names" list="nui-list" required placeholder="e.g., Miku, Rin, Len">
                <datalist id="nui-list">
                    {{range .Nuis}}
                    <option value="{{.Name}}">
                    {{end}}
                </datalist>
            </div>
            <div class="form-group">
                <label for="album_id">Add to Album <small>(optional)</small></label>
                <select id="album_id" name="album_id">
                    <option value="">No album</option>
                    {{range .Albums}}
                    <option value="{{.ID}}">{{.Name}}</option>
                    {{end}}
                </select>
            </div>
            <div class="form-group">
                <label for="taken_at">Date Taken</label>
                <input type="date" id="taken_at" name="taken_at">
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" rows="3"></textarea>
            </div>
            <button type="submit">Upload</button>
        </form>
    </main>
</body>
</html>
