apiVersion: v1
kind: Service
metadata:
  name: nuistagram-backend
  namespace: nuistagram
  labels:
    app.kubernetes.io/name: nuistagram-backend
    app.kubernetes.io/component: backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nuistagram-backend
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
